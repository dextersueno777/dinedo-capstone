services:
  postgres:
    image: postgres:16-alpine
    container_name: dinedo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dinedo}
      POSTGRES_USER: ${POSTGRES_USER:-dinedo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dinedo_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dinedo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dinedo_user} -d ${POSTGRES_DB:-dinedo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dinedo-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - dinedo_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dinedo_postgres_data:
  dinedo_redis_data:
